# Builds the client and server on every push to main and publishes them as the
# `pi-build` release asset, so the Raspberry Pi can download a finished build
# (scripts/update.sh) instead of compiling on its own CPU while the kiosk runs.
#
# The bundle contains no Mapbox token: the server injects it into index.html from
# the Pi's .env at serve time.
name: Pi build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pi-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Package
        run: |
          echo "$GITHUB_SHA" > BUILD_SHA
          tar -czf pi-build.tar.gz BUILD_SHA client/dist server/dist

      - name: Publish to the pi-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pi-build >/dev/null 2>&1 || gh release create pi-build \
            --prerelease --title "Pi build" \
            --notes "Prebuilt client and server for the Raspberry Pi. Replaced on every push to main; BUILD_SHA inside names the commit."
          gh release upload pi-build pi-build.tar.gz --clobber
